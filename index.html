<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0f0f">
<meta name="mobile-web-app-capable" content="yes">
<title>Gastos</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='120' fill='%230f0f0f'/%3E%3Crect x='60' y='60' width='392' height='392' rx='80' fill='%231a1a1a'/%3E%3Ctext x='256' y='320' font-size='240' text-anchor='middle' font-family='sans-serif'%3E💸%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='120' fill='%230f0f0f'/%3E%3Crect x='60' y='60' width='392' height='392' rx='80' fill='%231a1a1a'/%3E%3Ctext x='256' y='320' font-size='240' text-anchor='middle' font-family='sans-serif'%3E💸%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0f0f0f;--bg2:#1a1a1a;--bg3:#242424;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
  --text:#f0f0f0;--text2:#888;--text3:#555;
  --green:#22c55e;--green-bg:rgba(34,197,94,0.12);
  --amber:#f59e0b;--amber-bg:rgba(245,158,11,0.12);
  --red:#ef4444;--red-bg:rgba(239,68,68,0.12);
  --blue:#60a5fa;--blue-bg:rgba(96,165,250,0.12);
  --purple:#a78bfa;--purple-bg:rgba(167,139,250,0.12);
  --accent:#22c55e;
  --profile-color:#22c55e;
  --radius:14px;--radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow-x:hidden;}
body{padding-bottom:env(safe-area-inset-bottom,0);}

/* PROFILE SWITCHER */
.profile-bar{display:flex;gap:8px;padding:14px 20px 0;}
.profile-btn{flex:1;padding:9px 8px;border-radius:10px;border:0.5px solid var(--border);background:none;color:var(--text2);font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all 0.15s;font-family:'DM Sans',sans-serif;}
.profile-btn.active-personal{background:rgba(34,197,94,0.12);border-color:var(--green);color:var(--green);}
.profile-btn.active-raiden{background:rgba(96,165,250,0.12);border-color:var(--blue);color:var(--blue);}
.profile-dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0;}

.header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:0.5px solid var(--border);padding:10px 20px 12px;}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.app-name{font-size:20px;font-weight:600;letter-spacing:-0.3px;}
.app-name span{font-size:13px;font-weight:400;color:var(--text2);margin-left:6px;font-family:'DM Mono',monospace;}
.add-fab{width:38px;height:38px;border-radius:50%;background:var(--profile-color);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background 0.2s;}
.add-fab svg{width:20px;height:20px;stroke:#000;}

.mes-nav{display:flex;align-items:center;justify-content:space-between;}
.mes-btn{background:none;border:none;color:var(--text2);cursor:pointer;padding:4px 8px;border-radius:6px;}
.mes-btn:active{background:var(--bg3);}
.mes-label{font-family:'DM Mono',monospace;font-size:14px;font-weight:500;color:var(--text);}

.stats-wrap{padding:16px 20px 0;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.stat{background:var(--bg2);border-radius:var(--radius-sm);padding:10px 12px;border:0.5px solid var(--border);}
.stat-lbl{font-size:11px;color:var(--text3);margin-bottom:3px;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:0.04em;}
.stat-val{font-size:16px;font-weight:600;font-family:'DM Mono',monospace;}
.stat-val.g{color:var(--green);}.stat-val.a{color:var(--amber);}.stat-val.w{color:var(--text);}

.prog-wrap{margin-bottom:4px;}
.prog-track{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;}
.prog-fill{height:100%;border-radius:2px;background:var(--profile-color);transition:width 0.5s cubic-bezier(.4,0,.2,1);}
.prog-label{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;margin-top:4px;text-align:right;}

.tabs-wrap{padding:12px 20px 0;}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;border:0.5px solid var(--border);background:none;color:var(--text2);transition:all 0.15s;}
.tab.active{background:var(--text);color:var(--bg);border-color:var(--text);}

.list-wrap{padding:14px 20px;}
.list{display:flex;flex-direction:column;gap:8px;}

.gasto{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;align-items:center;gap:12px;transition:opacity 0.2s;position:relative;overflow:hidden;}
.gasto.pagado{opacity:0.45;}
.gasto.vencido{border-color:rgba(239,68,68,0.35);}
.gasto.vencido::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red);border-radius:14px 0 0 14px;}
.gasto.hoy::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--amber);border-radius:14px 0 0 14px;}
.gasto.recurrente::after{content:'';position:absolute;right:0;top:0;bottom:0;width:3px;background:var(--purple);border-radius:0 14px 14px 0;}

.check{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.15s;}
.check.on{background:var(--profile-color);border-color:var(--profile-color);}
.check svg{width:13px;height:13px;stroke:#000;display:none;}
.check.on svg{display:block;}

.gasto-body{flex:1;min-width:0;}
.gasto-nombre{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gasto.pagado .gasto-nombre{text-decoration:line-through;color:var(--text2);}
.gasto-meta{display:flex;gap:6px;align-items:center;margin-top:3px;flex-wrap:wrap;}
.gasto-fecha{font-size:12px;color:var(--text3);font-family:'DM Mono',monospace;}
.badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:0.04em;}
.badge.vencido{background:var(--red-bg);color:var(--red);}
.badge.hoy{background:var(--amber-bg);color:var(--amber);}
.badge.ok{background:var(--green-bg);color:var(--green);}
.badge.rec{background:var(--blue-bg);color:var(--blue);}
.badge.rep{background:var(--purple-bg);color:var(--purple);}

.gasto-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;}
.gasto-monto{font-family:'DM Mono',monospace;font-size:15px;font-weight:500;}
.gasto-actions{display:flex;gap:4px;}
.icon-btn{background:none;border:none;cursor:pointer;padding:4px;color:var(--text3);border-radius:6px;display:flex;align-items:center;}
.icon-btn:active{background:var(--bg3);color:var(--text);}
.icon-btn svg{width:16px;height:16px;stroke:currentColor;}

.empty{text-align:center;padding:3rem 1rem;color:var(--text3);}
.empty svg{width:40px;height:40px;stroke:currentColor;margin:0 auto 10px;display:block;opacity:0.4;}
.empty p{font-size:14px;}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:50;display:flex;align-items:flex-end;}
.modal-overlay.hidden{display:none;}
.modal{background:var(--bg2);border-radius:20px 20px 0 0;border:0.5px solid var(--border);padding:20px 20px calc(20px + env(safe-area-inset-bottom,0));width:100%;max-height:92vh;overflow-y:auto;}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 16px;}
.modal-title{font-size:17px;font-weight:600;margin-bottom:20px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--text3);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;}
.field input,.field select{width:100%;background:var(--bg3);border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;font-size:16px;color:var(--text);font-family:'DM Sans',sans-serif;outline:none;appearance:none;-webkit-appearance:none;}
.field input:focus,.field select:focus{border-color:var(--profile-color);}
.field input::placeholder{color:var(--text3);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.cat-opt{background:var(--bg3);border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:10px 6px;text-align:center;cursor:pointer;font-size:11px;color:var(--text2);line-height:1.4;transition:all 0.15s;}
.cat-opt svg{width:20px;height:20px;stroke:currentColor;display:block;margin:0 auto 4px;}
.cat-opt.sel{border-color:var(--profile-color);background:rgba(34,197,94,0.12);color:var(--profile-color);}

.rep-opciones{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.rep-opt{background:var(--bg3);border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:8px 4px;text-align:center;cursor:pointer;font-size:12px;color:var(--text2);transition:all 0.15s;}
.rep-opt.sel{border-color:var(--purple);background:var(--purple-bg);color:var(--purple);}
.rep-sub{margin-top:10px;display:none;}
.rep-sub.visible{display:block;}

.modal-actions{display:flex;gap:10px;margin-top:20px;}
.btn-save{flex:1;background:var(--profile-color);color:#000;border:none;border-radius:var(--radius-sm);padding:14px;font-size:16px;font-weight:600;cursor:pointer;transition:background 0.2s;}
.btn-cancel{background:var(--bg3);color:var(--text2);border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:14px 20px;font-size:16px;cursor:pointer;}

.del-sheet{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:60;display:flex;align-items:flex-end;}
.del-sheet.hidden{display:none;}
.del-box{background:var(--bg2);border-radius:20px 20px 0 0;border:0.5px solid var(--border);padding:20px 20px calc(20px + env(safe-area-inset-bottom,0));width:100%;}
.del-box p{font-size:15px;color:var(--text2);margin-bottom:6px;text-align:center;}
.del-box strong{color:var(--text);}
.del-info{font-size:13px;color:var(--text3);text-align:center;margin-bottom:14px;}
.del-btns{display:flex;gap:10px;}
.btn-del{flex:1;background:var(--red);color:#fff;border:none;border-radius:var(--radius-sm);padding:14px;font-size:15px;font-weight:600;cursor:pointer;}
select option{background:#1a1a1a;}
</style>
</head>
<body>

<div class="profile-bar">
  <button class="profile-btn active-personal" id="btn-personal" onclick="setProfile('personal')">
    <span class="profile-dot"></span> Personal
  </button>
  <button class="profile-btn" id="btn-raiden" onclick="setProfile('raiden')">
    <span class="profile-dot"></span> Raiden
  </button>
</div>

<div class="header">
  <div class="header-top">
    <div class="app-name">💸 <span id="profile-label">Personal</span></div>
    <button class="add-fab" id="add-fab" onclick="abrirModal()" aria-label="Agregar gasto">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
  </div>
  <div class="mes-nav">
    <button class="mes-btn" onclick="cambiarMes(-1)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <span class="mes-label" id="mes-label">—</span>
    <button class="mes-btn" onclick="cambiarMes(1)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>
</div>

<div class="stats-wrap">
  <div class="stats">
    <div class="stat"><div class="stat-lbl">Total</div><div class="stat-val w" id="s-total">$0</div></div>
    <div class="stat"><div class="stat-lbl">Pagado</div><div class="stat-val g" id="s-pagado">$0</div></div>
    <div class="stat"><div class="stat-lbl">Pendiente</div><div class="stat-val a" id="s-pend">$0</div></div>
  </div>
  <div class="prog-wrap">
    <div class="prog-track"><div class="prog-fill" id="prog" style="width:0%"></div></div>
    <div class="prog-label" id="prog-label">0% pagado</div>
  </div>
</div>

<div class="tabs-wrap">
  <div class="tabs" id="tabs-container">
    <button class="tab active" onclick="setTab('todos',this)">Todos</button>
    <button class="tab" onclick="setTab('pendientes',this)">Pendientes</button>
    <button class="tab" onclick="setTab('pagados',this)">Pagados</button>
    <button class="tab" onclick="setTab('fijos',this)">Fijos</button>
    <button class="tab" onclick="setTab('recordatorios',this)">Recordatorios</button>
  </div>
</div>

<div class="list-wrap">
  <div class="list" id="lista"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay hidden" id="modal" onclick="onOverlayClick(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title">Nuevo gasto</div>
    <div class="field">
      <label>Nombre</label>
      <input type="text" id="f-nombre" placeholder="ej. Alquiler, luz, empleada...">
    </div>
    <div class="field-row">
      <div class="field">
        <label>Monto ($)</label>
        <input type="number" id="f-monto" placeholder="0" inputmode="decimal">
      </div>
      <div class="field">
        <label>Día vencimiento</label>
        <input type="number" id="f-dia" placeholder="ej. 10" min="1" max="31" inputmode="numeric">
      </div>
    </div>
    <div class="field">
      <label>Tipo</label>
      <div class="cat-grid">
        <div class="cat-opt sel" data-cat="servicio" onclick="selCat(this)">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>Servicio
        </div>
        <div class="cat-opt" data-cat="suscripcion" onclick="selCat(this)">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>Suscripción
        </div>
        <div class="cat-opt" data-cat="cuota" onclick="selCat(this)">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>Cuota
        </div>
        <div class="cat-opt" data-cat="empleada" onclick="selCat(this)">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Empleada
        </div>
        <div class="cat-opt" data-cat="alquiler" onclick="selCat(this)">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Alquiler
        </div>
        <div class="cat-opt" data-cat="proveedor" onclick="selCat(this)">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/></svg>Proveedor
        </div>
        <div class="cat-opt" data-cat="impuesto" onclick="selCat(this)">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8m-4-4v4"/></svg>Impuesto
        </div>
        <div class="cat-opt" data-cat="recordatorio" onclick="selCat(this)">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>Recordatorio
        </div>
      </div>
    </div>
    <div class="field">
      <label>Repetición</label>
      <div class="rep-opciones">
        <div class="rep-opt sel" data-rep="0" onclick="selRep(this)">No repetir</div>
        <div class="rep-opt" data-rep="1" onclick="selRep(this)">Cada mes</div>
        <div class="rep-opt" data-rep="2" onclick="selRep(this)">Cada 2 meses</div>
        <div class="rep-opt" data-rep="3" onclick="selRep(this)">Cada 3 meses</div>
        <div class="rep-opt" data-rep="6" onclick="selRep(this)">Cada 6 meses</div>
        <div class="rep-opt" data-rep="12" onclick="selRep(this)">Cada año</div>
      </div>
      <div class="rep-sub" id="rep-sub">
        <div class="field-row" style="margin-top:10px">
          <div class="field" style="margin-bottom:0">
            <label>Mes inicio</label>
            <select id="f-mes-inicio"></select>
          </div>
          <div class="field" style="margin-bottom:0">
            <label>Termina</label>
            <select id="f-fin-tipo" onchange="actualizarFinTipo()">
              <option value="nunca">Nunca</option>
              <option value="cuotas">En N cuotas</option>
              <option value="fecha">En fecha</option>
            </select>
          </div>
        </div>
        <div id="fin-cuotas-wrap" style="display:none;margin-top:10px">
          <div class="field" style="margin-bottom:0">
            <label>Cantidad de cuotas</label>
            <input type="number" id="f-cuotas" placeholder="ej. 12" min="1" inputmode="numeric">
          </div>
        </div>
        <div id="fin-fecha-wrap" style="display:none;margin-top:10px">
          <div class="field" style="margin-bottom:0">
            <label>Fecha fin</label>
            <input type="month" id="f-fin-fecha">
          </div>
        </div>
      </div>
    </div>
    <div class="field">
      <label>Notas (opcional)</label>
      <input type="text" id="f-notas" placeholder="ej. Débito automático...">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
      <button class="btn-save" id="btn-save" onclick="guardar()">Guardar</button>
    </div>
  </div>
</div>

<!-- DELETE -->
<div class="del-sheet hidden" id="del-sheet">
  <div class="del-box">
    <p>¿Eliminar <strong id="del-nombre"></strong>?</p>
    <div class="del-info" id="del-rep-info"></div>
    <div class="del-btns">
      <button class="btn-cancel" onclick="cerrarDel()" style="flex:1">Cancelar</button>
      <button class="btn-del" id="btn-del-este" onclick="confirmarDel('este')">Solo este mes</button>
      <button class="btn-del" style="opacity:0.75" id="btn-del-todos" onclick="confirmarDel('todos')">Todos</button>
    </div>
  </div>
</div>

<script>
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const KEY='mis_gastos_v3';
const PROFILES={
  personal:{label:'Personal',color:'#22c55e',colorBg:'rgba(34,197,94,0.12)'},
  raiden:{label:'Raiden',color:'#60a5fa',colorBg:'rgba(96,165,250,0.12)'}
};

let perfil='personal';
let data={personal:{bases:[],instancias:{}},raiden:{bases:[],instancias:{}}};
let mes=new Date().getMonth();
let anio=new Date().getFullYear();
let tabActivo='todos';
let editId=null,delId=null,catSel='servicio',repSel=0;

function cargar(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){
      const saved=JSON.parse(raw);
      if(saved.personal) data.personal=saved.personal;
      if(saved.raiden) data.raiden=saved.raiden;
      if(saved.perfil) perfil=saved.perfil;
      if(saved.mes!==undefined) mes=saved.mes;
      if(saved.anio!==undefined) anio=saved.anio;
    }
    if(!data.personal.bases) data.personal={bases:[],instancias:{}};
    if(!data.raiden.bases) data.raiden={bases:[],instancias:{}};
  }catch(e){data={personal:{bases:[],instancias:{}},raiden:{bases:[],instancias:{}}};}
}
function guardarLS(){localStorage.setItem(KEY,JSON.stringify({...data,perfil,mes,anio}));}

function pd(){return data[perfil];}
function iKey(id,m,a){return `${id}_${a}_${m}`;}

function apareceEn(b,m,a){
  if(b.rep===0) return b.mes===m&&b.anio===a;
  const start=b.anio*12+b.mes,target=a*12+m,diff=target-start;
  if(diff<0||diff%b.rep!==0) return false;
  if(b.finTipo==='cuotas') return (diff/b.rep)<b.finCuotas;
  if(b.finTipo==='fecha'){const fin=b.finAnio*12+b.finMes;return target<=fin;}
  return true;
}

function gastosDelMes(){
  return pd().bases.filter(b=>apareceEn(b,mes,anio)).map(b=>{
    const k=iKey(b.id,mes,anio);
    const inst=pd().instancias[k]||{};
    if(inst.eliminado) return null;
    let fecha=null;
    if(b.dia){const d=Math.min(b.dia,new Date(anio,mes+1,0).getDate());fecha=`${anio}-${String(mes+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
    return{...b,fecha,pagado:inst.pagado||false,_inst:k};
  }).filter(Boolean);
}

function setProfile(p){
  perfil=p;
  const pc=PROFILES[p];
  document.documentElement.style.setProperty('--profile-color',pc.color);
  document.getElementById('profile-label').textContent=pc.label;
  document.getElementById('btn-personal').className='profile-btn'+(p==='personal'?' active-personal':'');
  document.getElementById('btn-raiden').className='profile-btn'+(p==='raiden'?' active-raiden':'');
  // Reset tab
  tabActivo='todos';
  document.querySelectorAll('.tab').forEach((t,i)=>{t.classList.toggle('active',i===0);});
  guardarLS();render();
}

function poblarMesInicio(){
  const sel=document.getElementById('f-mes-inicio');sel.innerHTML='';
  const hoy=new Date();
  for(let i=-2;i<=12;i++){
    let m=hoy.getMonth()+i,a=hoy.getFullYear();
    while(m<0){m+=12;a--;} while(m>11){m-=12;a++;}
    const opt=document.createElement('option');
    opt.value=`${a}-${m}`;opt.textContent=MESES[m]+' '+a;
    if(i===0)opt.selected=true;sel.appendChild(opt);
  }
}

function render(){
  document.getElementById('mes-label').textContent=MESES[mes]+' '+anio;
  const lista=gastosDelMes();
  const conMonto=lista.filter(g=>g.cat!=='recordatorio');
  const total=conMonto.reduce((s,g)=>s+(+g.monto||0),0);
  const pagado=conMonto.filter(g=>g.pagado).reduce((s,g)=>s+(+g.monto||0),0);
  const pend=total-pagado;
  const pct=total>0?Math.round(pagado/total*100):0;

  document.getElementById('s-total').textContent='$'+total.toLocaleString('es-AR');
  document.getElementById('s-pagado').textContent='$'+pagado.toLocaleString('es-AR');
  document.getElementById('s-pend').textContent='$'+pend.toLocaleString('es-AR');
  document.getElementById('prog').style.width=pct+'%';
  document.getElementById('prog-label').textContent=pct+'% pagado';

  const hoy=new Date();hoy.setHours(0,0,0,0);
  let filtrada=lista;
  if(tabActivo==='pendientes') filtrada=lista.filter(g=>!g.pagado&&g.cat!=='recordatorio');
  if(tabActivo==='pagados') filtrada=lista.filter(g=>g.pagado);
  if(tabActivo==='fijos') filtrada=lista.filter(g=>g.rep>0);
  if(tabActivo==='recordatorios') filtrada=lista.filter(g=>g.cat==='recordatorio');

  filtrada.sort((a,b)=>{
    if(!a.fecha&&!b.fecha)return 0;if(!a.fecha)return 1;if(!b.fecha)return-1;
    return new Date(a.fecha)-new Date(b.fecha);
  });

  const el=document.getElementById('lista');
  if(!filtrada.length){
    el.innerHTML=`<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="13" y2="13"/></svg><p>Sin gastos aquí</p></div>`;
    return;
  }

  el.innerHTML=filtrada.map(g=>{
    const fecha=g.fecha?new Date(g.fecha+'T00:00:00'):null;
    const diff=fecha?Math.round((fecha-hoy)/86400000):null;
    const esVencido=!g.pagado&&diff!==null&&diff<0;
    const esHoy=!g.pagado&&diff===0;
    const esRec=g.rep>0;
    let badge='';
    if(g.cat==='recordatorio') badge=`<span class="badge rec">Recordatorio</span>`;
    else if(esVencido) badge=`<span class="badge vencido">Vencido</span>`;
    else if(esHoy) badge=`<span class="badge hoy">Hoy</span>`;
    else if(g.pagado) badge=`<span class="badge ok">Pagado</span>`;
    const repLabel=esRec?repTexto(g.rep):'';
    const fechaStr=fecha?fecha.toLocaleDateString('es-AR',{day:'numeric',month:'short'}):'';
    const clases=['gasto',g.pagado?'pagado':'',esVencido?'vencido':'',esHoy?'hoy':'',esRec?'recurrente':''].filter(Boolean).join(' ');
    const safeNombre=g.nombre.replace(/'/g,"\\'");
    return `
    <div class="${clases}">
      <div class="check${g.pagado?' on':''}" onclick="togglePago('${g.id}')" role="checkbox" aria-checked="${g.pagado}">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="gasto-body">
        <div class="gasto-nombre">${g.nombre}</div>
        <div class="gasto-meta">
          ${fechaStr?`<span class="gasto-fecha">vence ${fechaStr}</span>`:''}
          ${badge}
          ${repLabel?`<span class="badge rep">↻ ${repLabel}</span>`:''}
          ${g.notas?`<span class="gasto-fecha">· ${g.notas}</span>`:''}
        </div>
      </div>
      <div class="gasto-right">
        ${g.cat!=='recordatorio'?`<div class="gasto-monto">$${(+g.monto||0).toLocaleString('es-AR')}</div>`:''}
        <div class="gasto-actions">
          <button class="icon-btn" onclick="editar('${g.id}')" aria-label="Editar">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="icon-btn" onclick="pedirDel('${g.id}','${safeNombre}',${esRec})" aria-label="Eliminar">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          </button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function repTexto(r){
  return{1:'mensual',2:'bimestral',3:'trimestral',6:'semestral',12:'anual'}[r]||`cada ${r}m`;
}

function togglePago(id){
  const g=gastosDelMes().find(x=>x.id===id);
  if(!g||g.cat==='recordatorio')return;
  const k=g._inst;
  if(!pd().instancias[k])pd().instancias[k]={};
  pd().instancias[k].pagado=!g.pagado;
  guardarLS();render();
}

function pedirDel(id,nombre,esRec){
  delId=id;
  document.getElementById('del-nombre').textContent=nombre;
  document.getElementById('del-rep-info').textContent=esRec?'Es un gasto recurrente.':'';
  document.getElementById('btn-del-este').style.display=esRec?'':'none';
  document.getElementById('btn-del-todos').textContent=esRec?'Todos los meses':'Eliminar';
  document.getElementById('del-sheet').classList.remove('hidden');
}
function cerrarDel(){document.getElementById('del-sheet').classList.add('hidden');delId=null;}
function confirmarDel(modo){
  if(modo==='este'){
    const g=gastosDelMes().find(x=>x.id===delId);
    if(g){if(!pd().instancias[g._inst])pd().instancias[g._inst]={};pd().instancias[g._inst].eliminado=true;}
  }else{
    pd().bases=pd().bases.filter(x=>x.id!==delId);
    Object.keys(pd().instancias).forEach(k=>{if(k.startsWith(delId+'_'))delete pd().instancias[k];});
  }
  guardarLS();cerrarDel();render();
}

function editar(id){
  const b=pd().bases.find(x=>x.id===id);if(!b)return;
  editId=id;
  document.getElementById('f-nombre').value=b.nombre;
  document.getElementById('f-monto').value=b.monto;
  document.getElementById('f-dia').value=b.dia||'';
  document.getElementById('f-notas').value=b.notas||'';
  catSel=b.cat;repSel=b.rep||0;
  document.querySelectorAll('.cat-opt').forEach(el=>el.classList.toggle('sel',el.dataset.cat===b.cat));
  document.querySelectorAll('.rep-opt').forEach(el=>el.classList.toggle('sel',+el.dataset.rep===repSel));
  actualizarRepSub();poblarMesInicio();
  const msVal=`${b.anio}-${b.mes}`;
  const opt=document.querySelector(`#f-mes-inicio option[value="${msVal}"]`);
  if(opt)opt.selected=true;
  document.getElementById('f-fin-tipo').value=b.finTipo||'nunca';
  actualizarFinTipo();
  if(b.finTipo==='cuotas')document.getElementById('f-cuotas').value=b.finCuotas||'';
  if(b.finTipo==='fecha')document.getElementById('f-fin-fecha').value=`${b.finAnio}-${String(b.finMes+1).padStart(2,'0')}`;
  document.getElementById('modal-title').textContent='Editar gasto';
  document.getElementById('modal').classList.remove('hidden');
}

function abrirModal(){
  editId=null;
  ['f-nombre','f-monto','f-dia','f-notas'].forEach(id=>document.getElementById(id).value='');
  catSel='servicio';repSel=0;
  document.querySelectorAll('.cat-opt').forEach(el=>el.classList.toggle('sel',el.dataset.cat==='servicio'));
  document.querySelectorAll('.rep-opt').forEach(el=>el.classList.toggle('sel',el.dataset.rep==='0'));
  actualizarRepSub();poblarMesInicio();
  document.getElementById('f-fin-tipo').value='nunca';actualizarFinTipo();
  document.getElementById('modal-title').textContent='Nuevo gasto — '+PROFILES[perfil].label;
  document.getElementById('modal').classList.remove('hidden');
  setTimeout(()=>document.getElementById('f-nombre').focus(),100);
}

function cerrarModal(){document.getElementById('modal').classList.add('hidden');}
function onOverlayClick(e){if(e.target===document.getElementById('modal'))cerrarModal();}

function selCat(el){
  catSel=el.dataset.cat;
  document.querySelectorAll('.cat-opt').forEach(x=>x.classList.remove('sel'));
  el.classList.add('sel');
}
function selRep(el){
  repSel=+el.dataset.rep;
  document.querySelectorAll('.rep-opt').forEach(x=>x.classList.remove('sel'));
  el.classList.add('sel');actualizarRepSub();
}
function actualizarRepSub(){document.getElementById('rep-sub').classList.toggle('visible',repSel>0);}
function actualizarFinTipo(){
  const v=document.getElementById('f-fin-tipo').value;
  document.getElementById('fin-cuotas-wrap').style.display=v==='cuotas'?'':'none';
  document.getElementById('fin-fecha-wrap').style.display=v==='fecha'?'':'none';
}

function guardar(){
  const nombre=document.getElementById('f-nombre').value.trim();
  if(!nombre){document.getElementById('f-nombre').focus();return;}
  const monto=parseFloat(document.getElementById('f-monto').value)||0;
  const dia=parseInt(document.getElementById('f-dia').value)||null;
  const notas=document.getElementById('f-notas').value.trim();
  const finTipo=document.getElementById('f-fin-tipo').value;
  const mesInicioVal=document.getElementById('f-mes-inicio').value;
  const [mIa,mIm]=mesInicioVal.split('-').map(Number);
  let finCuotas=null,finMes=null,finAnio=null;
  if(finTipo==='cuotas')finCuotas=parseInt(document.getElementById('f-cuotas').value)||1;
  if(finTipo==='fecha'){const fv=document.getElementById('f-fin-fecha').value;if(fv){const[fa,fm]=fv.split('-');finAnio=+fa;finMes=+fm-1;}}
  const base={nombre,monto,dia,notas,cat:catSel,rep:repSel,
    mes:repSel>0?mIm:mes,anio:repSel>0?mIa:anio,
    finTipo,finCuotas,finMes,finAnio};
  if(editId){
    const idx=pd().bases.findIndex(x=>x.id===editId);
    if(idx>=0)pd().bases[idx]={...pd().bases[idx],...base};
  }else{
    pd().bases.push({id:Date.now().toString(),...base});
  }
  guardarLS();cerrarModal();render();
}

function setTab(tab,el){
  tabActivo=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');render();
}
function cambiarMes(dir){
  mes+=dir;if(mes>11){mes=0;anio++;}if(mes<0){mes=11;anio--;}
  guardarLS();render();
}

cargar();
setProfile(perfil);

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
}
</script>
</body>
</html>
